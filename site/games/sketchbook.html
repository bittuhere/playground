<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #0b0d11;
  }
  iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
</style>
</head>
<body>

<iframe
  src="./sketchbook/index.html"
  title="Dashboard"
  allowfullscreen
  webkitallowfullscreen
  mozallowfullscreen
  allow="
    accelerometer *;
    ambient-light-sensor *;
    autoplay *;
    battery *;
    bluetooth *;
    camera *;
    clipboard-read *;
    clipboard-write *;
    compute-pressure *;
    cross-origin-isolated *;
    display-capture *;
    document-domain *;
    encrypted-media *;
    execution-while-not-rendered *;
    execution-while-out-of-viewport *;
    fullscreen *;
    gamepad *;
    geolocation *;
    gyroscope *;
    hid *;
    identity-credentials-get *;
    idle-detection *;
    keyboard-map *;
    local-fonts *;
    magnetometer *;
    microphone *;
    midi *;
    navigation-override *;
    otp-credentials *;
    payment *;
    picture-in-picture *;
    publickey-credentials-create *;
    publickey-credentials-get *;
    screen-wake-lock *;
    serial *;
    speaker-selection *;
    storage-access *;
    sync-xhr *;
    usb *;
    web-share *;
    window-management *;
    window-placement *;
    xr-spatial-tracking *
  "
></iframe>

</body>
</html>
